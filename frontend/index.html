<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />


  <!-- Black app icon on light browser chrome, blue app icon elsewhere -->
  <link rel="icon" type="image/svg+xml" href="src/assets/mage-icon.svg" />
  <link rel="icon" type="image/svg+xml" href="src/assets/mage-icon-dark.svg" media="(prefers-color-scheme: light)" />
  <!-- viewport-fit=cover lets the app draw under the notch / home indicator; safe areas are padded in adaptive.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="GMOS — the restaurant operating system" />
  <meta name="theme-color" content="#0b0e17" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GMOS" />
  <meta name="format-detection" content="telephone=no" />
  <title>GMOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
